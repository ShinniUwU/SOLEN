name: Debug network-info (temporary)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug:
    name: Run network-info with visible stderr
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Show environment
        run: |
          command -v ip && ip -V || echo "no ip command"
          echo "---"
          ip -brief address show || echo "ip -brief address show failed rc=$?"
          echo "---"
          ip address show || echo "ip address show failed rc=$?"
      - name: Run network-info directly (stderr visible)
        run: |
          SOLEN_NO_TUI=1 SOLEN_PLAIN=1 TERM=dumb ./serverutils run network/network-info -- --json
          echo "exit code: $?"
